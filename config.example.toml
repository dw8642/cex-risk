[system]
debug = true
env = "local"
http_port = "8080"
http_proxy = "127.0.0.1:7897"

[database]
host = "127.0.0.1"
port = "3306"
user = "root"
pass = "CHANGE_ME"
name = "cex_risk"
charset = "utf8mb4"
prefix = ""
max_idle_conn = 10
max_open_conn = 100
max_life_time = 600

[clickhouse]
host = "127.0.0.1"
port = "9000"
user = "default"
pass = ""
name = "cex_risk"

[redis]
host = "127.0.0.1"
port = "6379"
user = ""
pass = ""
db = 2
pool_size = 10

[kafka]
brokers = ["127.0.0.1:9092"]

[kafka.topics]
trade_events = "risk_trade_events"
position_snapshots = "risk_position_snapshots"
balance_snapshots = "risk_balance_snapshots"
account_updates = "risk_account_updates"
risk_events = "risk_risk_events"
permission_checks = "risk_permission_checks"

[binance]
futures_ws = "wss://fstream.binance.com"
futures_rest = "https://fapi.binance.com"
use_testnet = false
testnet_futures_ws = "wss://stream.binancefuture.com"
testnet_futures_rest = "https://testnet.binancefuture.com"

[telegram]
bot_token = "CHANGE_ME"
chat_ids = ["CHANGE_ME"]
app_id = 0
app_hash = ""
phone = ""
session_name = "local"

[twilio]
account_sid = ""
auth_token = ""
from_number = ""

[risk_engine]
alert_check_interval = "10s"
rest_reconcile_interval = "30s"
permission_check_interval = "60s"
metrics_window = "5m"

[sentinel]
poll_interval = "10s"
symbol = "BTCUSDT"

[[accounts]]
id = "acc-01"
exchange = "binance_futures"
account_type = "portfolio_margin"
api_key = ""
secret_key = ""
label = "主力1-PM"

[[accounts]]
id = "acc-02"
exchange = "binance_futures"
account_type = "regular"
api_key = ""
secret_key = ""
label = "策略2"

[rules]
margin_ratio_threshold = 0.5
pm_unimmr_threshold = 1.5
pm_status_alert = true
delta_change_rate_threshold = 0.3
delta_abs_threshold = 5000.0
position_change_threshold = 50000.0
expected_funding_interval = 28800000
funding_interval_alert_cooldown = 3600
data_gap_threshold = 30
liq_distance_l2_threshold = 0.05
liq_distance_l3_threshold = 0.02
adl_quantile_l2_threshold = 4
funding_rate_annualized_l2 = 0.25
funding_rate_cooldown = 1800
api_latency_threshold_ms = 2000
api_error_rate_threshold = 0.1
price_jump_window_minutes = 60
price_jump_threshold = 0.10
price_jump_cooldown = 600
cooldown_ttl = 300