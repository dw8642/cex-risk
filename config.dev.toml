# ============================================================
# 规则阈值 — 仅作为 MySQL 不可用时的兜底默认值
# 正常运行时，阈值从 MySQL risk_rules.config JSON + sentinel_config 表读取
# 修改阈值请直接改 MySQL，无需重启（热重载间隔见 sentinel_config.rule_reload_interval）
# ============================================================
[rules]
margin_ratio_threshold = 0.5              # L-001: 普通合约 maintMargin/marginBalance
pm_unimmr_threshold = 1.5                 # L-001: PM 统一账户 uniMMR（越小越危险）
pm_status_alert = true                    # L-001: 监控 PM accountStatus 异常
delta_change_rate_threshold = 0.3         # E-001: 净Delta变化率阈值（0.3 = 30%）
delta_abs_threshold = 5000.0              # E-001: 净Delta绝对变化兜底（USD）
position_change_threshold = 50000.0       # E-005: 仓位变动阈值（USD/周期）
expected_funding_interval = 28800000      # E-008c: 预期资金费结算间隔（ms，28800000=8h）
funding_interval_alert_cooldown = 3600    # E-008c: 同一币种告警冷却（秒）
data_gap_threshold = 30                   # S-004: 数据断流阈值（秒）
liq_distance_l2_threshold = 0.05          # L-002: 爆仓距离 L2 预警线（5%）
liq_distance_l3_threshold = 0.02          # L-002: 爆仓距离 L3 紧急线（2%）
adl_quantile_l2_threshold = 4             # L-003: ADL 等级 L2 阈值（1-5，4=高风险）
funding_rate_annualized_l2 = 0.25         # E-008: 资金费率年化 L2 阈值（25%）
funding_rate_cooldown = 1800              # E-008: 告警冷却（秒）
api_latency_threshold_ms = 2000           # S-014: API 平均延迟阈值（ms）
api_error_rate_threshold = 0.1            # S-014: API 错误率阈值（10%）
price_jump_window_minutes = 60            # M-001: 价格跳变观察窗口（分钟）
price_jump_threshold = 0.10               # M-001: 价格跳变阈值（10%）
price_jump_cooldown = 600                 # M-001: 告警冷却（秒）
cooldown_ttl = 300                        # 全局告警冷却（秒）
